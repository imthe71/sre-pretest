# Replace every stringData value before applying. Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: asiayo
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: asiayo
type: Opaque
stringData:
  root-password: "CHANGE_ME_ROOT_PASSWORD"
  app-username: "app"
  app-password: "CHANGE_ME_APP_PASSWORD"
  app-database: "app"
